<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Workout Log</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Workouts">
<style>
/* VOICE: utilitarian gym logger, quiet and fast
   IDEA: a faithful clone of the RepCount iPhone log, with the paywalled parts unlocked
   PICTURE: the working log itself
   COLOUR and TYPE: black ground, charcoal cards, one cyan accent; SF system font
   LAYOUT: single phone column, floating pill controls, bottom sheets */
:root{color-scheme:dark;--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--sheet:#232325;--key:#636366;--line:#38383a;--fg:#fff;--val:#d1d1d6;--muted:#8e8e93;--dim:#5a5a5e;--ac:#6ff1ff;--act:#5fd6e6;--acd:#0b4d57;--red:#ff453a}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow-x:clip}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
input,textarea{font:inherit;color:var(--fg);background:none;border:0;outline:none;padding:0;width:100%;-webkit-appearance:none;appearance:none}
input::placeholder,textarea::placeholder{color:var(--dim)}
svg{display:block}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scr{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 120px)}
.bar{display:flex;align-items:center;gap:10px;height:48px}
.sp{flex:1}
.circ{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid #2a2a2c;display:grid;place-items:center;flex:none}
.circ.ac{background:var(--ac);border-color:var(--ac);color:var(--acd)}
.pill{height:46px;border-radius:23px;background:var(--card);border:1px solid #2a2a2c;padding:0 18px;display:flex;align-items:center;gap:22px;font-size:19px;flex:none}
.finish{height:46px;border-radius:23px;background:var(--ac);color:var(--acd);font-weight:600;font-size:20px;padding:0 20px;flex:none}
.sticky{position:sticky;top:0;z-index:4;margin:calc(-10px - env(safe-area-inset-top)) -16px 0;padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;background:linear-gradient(#000 78%,rgba(0,0,0,0))}
.wdate{font-size:22px;font-weight:600;white-space:nowrap}
.htitle{position:absolute;left:50%;transform:translateX(-50%);font-size:18px;font-weight:600;opacity:0;transition:opacity .15s}
.sticky.scrolled .htitle{opacity:1}
h1{font-size:40px;font-weight:800;margin:10px 0 18px;letter-spacing:-.5px}
.mh{display:flex;justify-content:space-between;color:var(--muted);font-size:21px;font-weight:600;padding:8px 16px 12px}
.wl{background:var(--card);border-radius:24px;padding:0 16px;margin-bottom:22px}
.wr{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;align-items:flex-start}
.wr:last-child{border-bottom:0}
.badge{width:48px;flex:none;border-radius:12px;background:var(--card2);text-align:center;overflow:hidden}
.badge b{display:block;font-size:22px;padding:2px 0 6px}
.badge span{display:block;font-size:13px;color:var(--muted);padding-top:5px;background:#333336}
.wt{display:flex;justify-content:space-between;gap:8px;font-size:22px;font-weight:700;margin-bottom:4px}
.wt em{font-style:normal;font-weight:400;color:var(--muted);font-size:19px;white-space:nowrap}
.wt em.live{color:var(--act)}
.wx{font-size:18px;line-height:1.38;color:#e5e5ea}
.del{color:var(--red);flex:none;align-self:center}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:17px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 8px);width:min(520px,calc(100% - 24px));height:66px;border-radius:33px;background:rgba(28,28,30,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid #2c2c2e;display:flex;padding:5px;z-index:5}
.tabs button{flex:1;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:#e5e5ea}
.tabs button.on{background:var(--card2);color:var(--act)}
.tabs .ic{width:26px;height:26px}
.card{background:var(--card);border-radius:24px;padding:0 16px;margin-bottom:16px}
.name{font-size:34px;font-weight:700;padding:16px 0 14px;border-bottom:1px solid var(--line)}
.name::placeholder{color:var(--muted)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-bottom:1px solid var(--line);font-size:19px;position:relative;width:100%;text-align:left}
.frow:last-child{border-bottom:0}
.li .v{color:var(--muted);margin-left:auto;margin-right:6px}
.frow .v{color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow input[type=datetime-local]{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.frow.notes{color:var(--muted)}
.frow.notes.has{color:var(--fg)}
.bwv{min-width:70px;padding:6px 0}
.bwv .vv{justify-content:flex-end;font-size:19px;font-weight:400;height:auto}
.ex{background:var(--card);border-radius:24px;padding:0 16px;margin-bottom:16px}
.ex.ss{box-shadow:inset 4px 0 0 var(--ac)}
.exh{display:flex;align-items:flex-start;gap:10px;padding:16px 0 14px;border-bottom:1px solid var(--line)}
.exh .t{flex:1;font-size:26px;font-weight:700;line-height:1.15}
.exh .t small{display:block;font-size:12px;font-weight:700;color:var(--act);letter-spacing:.02em;margin-bottom:2px}
.exh .t span{display:block;font-size:15px;font-weight:400;color:var(--muted);margin-top:4px}
.dots{color:var(--act);padding:4px 0 4px 10px;flex:none}
.swr{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.srow{display:flex;align-items:flex-start;gap:14px;padding:12px 0;background:var(--card);position:relative;z-index:1;touch-action:pan-y;transition:transform .6s cubic-bezier(.32,.72,0,1)}
.swr.dragging .srow{transition:none}
.sdel{position:absolute;right:0;top:0;bottom:0;width:92px;background:var(--red);color:#fff;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;border-radius:0}
.swr.grow{animation:rowIn .34s cubic-bezier(.32,.72,0,1)}
.sn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);display:grid;place-items:center;font-size:15px;flex:none;margin-top:12px}
.sn.wu{border-color:var(--dim)}
.cw{display:flex;flex-direction:column;gap:6px;flex:none}
.pair{display:flex;gap:14px;align-items:flex-end}
.cell{text-align:left;flex:none;min-width:58px}
.cell.t{min-width:74px}
.lb{font-size:16px;color:var(--muted);margin-bottom:2px;white-space:nowrap}
.vv{font-size:26px;font-weight:600;color:var(--val);height:32px;display:flex;align-items:center;white-space:nowrap}
.vv .ph{color:var(--dim)}
.cell.f .vv{color:var(--fg)}
.cell.f .vv .sel{background:rgba(111,241,255,.3);border-radius:3px}
.caret{display:inline-block;width:2px;height:26px;background:var(--ac);margin:0 1px;animation:blink 1s steps(1) infinite}
.gnames{display:flex;flex-direction:column;gap:6px}
.gname{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;text-align:left;line-height:1.2}
.gname em{display:block;font-size:14px;font-weight:400;color:var(--muted);font-style:normal;margin-top:2px}
.gl{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);font-size:12px;color:var(--muted);display:grid;place-items:center;flex:none;font-weight:500}
.sn.lt{font-size:12px;letter-spacing:-.3px}
.swr.inr{border-bottom:0}
.vt{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.vseg{display:flex;background:#141416;border:1px solid #2c2c2e;border-radius:16px;padding:2px}
.vseg button{padding:5px 10px;border-radius:13px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.vseg button.on{background:var(--card2);color:var(--act)}
.exh .t .vt{font-size:13px}
.gex{display:flex;flex-direction:column}
.gex .vt{margin:4px 0 4px 34px}
.hist .vl{font-weight:500;color:var(--act);font-size:13px;margin-left:6px}
.mdel{color:var(--red);display:grid;place-items:center}
.hw{position:relative;overflow:hidden;margin:0 -16px}
.hw::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:1px;background:var(--line);z-index:2}
.hw:last-child::after{display:none}
.hw>.wr{position:relative;z-index:1;background:var(--card);border-bottom:0;padding-left:16px;padding-right:16px;touch-action:pan-y;transition:transform .6s cubic-bezier(.32,.72,0,1)}
.hw.dragging>.wr{transition:none}
.hw>.sdel{width:92px}
.swr:not(.dragging):not(.open)>.sdel,.hw:not(.dragging):not(.open)>.sdel,.exw:not(.dragging):not(.open)>.sdel,.dwr:not(.dragging):not(.open)>.sdel{visibility:hidden}
.wl{overflow:hidden}
.sn.xs{font-size:10px;letter-spacing:-.5px}
button.sn{padding:0;transition:background-color .25s ease,border-color .25s ease,color .25s ease}
.sn.fail{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
button.sn:active{transform:scale(.88)}
.dwr{position:relative;overflow:hidden}
.dwr>.pair{position:relative;z-index:1;background:var(--card);touch-action:pan-y;transition:transform .6s cubic-bezier(.32,.72,0,1)}
.dwr.dragging>.pair{transition:none}
.dwr>.sdel{width:84px;top:4px;bottom:4px;border-radius:10px}
.exw{position:relative;overflow:hidden;margin:0 -16px;border-radius:24px 24px 0 0}
.exw::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:1px;background:var(--line);z-index:2}
.exw>.exh{position:relative;z-index:1;background:var(--card);border-bottom:0;padding-left:16px;padding-right:16px;touch-action:pan-y;transition:transform .6s cubic-bezier(.32,.72,0,1)}
.exw.dragging>.exh{transition:none}
.exw>.sdel{top:50%;bottom:auto;height:50px;width:76px;right:10px;margin-top:-25px;border-radius:14px}
.dgrp{background:#2c2c2e;border-radius:16px;overflow:hidden}
.dgrp button{display:block;width:100%;text-align:left;padding:16px;font-size:18px;border-bottom:1px solid var(--line)}
.dgrp button:last-child{border-bottom:0}
.exh .t.gnames .gl{display:grid;font-size:12px;font-weight:500;color:var(--muted);margin:0}
.exh .t.gnames .gname>span:last-child{display:block;font-size:22px;font-weight:700;color:var(--fg);margin:0}
.addbtn[disabled]{opacity:.35}
.ichips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pair .sn{margin:0 0 2px;font-size:13px}
.cw.dropset{gap:10px}
.adddrop{color:var(--act);font-size:15px;text-align:left;padding:4px 0}
.tag{font-size:12px;font-weight:700;color:var(--act);margin-bottom:2px}
@keyframes blink{50%{opacity:0}}
.cell.ncell{flex:1;min-width:0}
.ncell .vv{font-size:17px;font-weight:400;height:auto;min-height:32px;white-space:pre-wrap;word-break:break-word;display:block;line-height:1.3;padding-top:6px}
.ncell .caret{height:19px;vertical-align:-3px}
.txk{background:#2a2a2c;border-radius:30px 30px 0 0;padding:12px 4px calc(env(safe-area-inset-bottom) + 26px);touch-action:manipulation}
.txk .r{display:flex;gap:6px;justify-content:center;margin-bottom:11px}
.txk button{flex:1;max-width:44px;height:46px;border-radius:7px;background:var(--key);font-size:23px;display:grid;place-items:center;-webkit-user-select:none;user-select:none}
.txk button:active{background:#8e8e93}
.txk button.md{max-width:none;flex:1.4;background:#3e3e40;font-size:16px}
.txk button.md.on{background:#fff;color:#000}
.txk button.sp{max-width:none;flex:5;font-size:17px}
.txk button.rt{max-width:none;flex:2;background:#3e3e40;font-size:16px}
.txk .ic{width:26px;height:26px}
.keys,.txk{touch-action:manipulation}
.kpop{position:fixed;z-index:30;pointer-events:none;color:#fff}
.kpop .b,.kpop .s{position:absolute;background:#6c6c6e;box-shadow:0 3px 8px rgba(0,0,0,.45)}
.kpop .b{border-radius:12px;display:grid;place-items:center;font-size:36px;font-weight:400;padding-bottom:2px}
.kpop .s{border-radius:0 0 8px 8px;box-shadow:0 3px 6px rgba(0,0,0,.35)}
.kpop .s::before{content:"";position:absolute;left:0;right:0;top:-12px;height:14px;background:#6c6c6e}
.exf{display:flex;align-items:center;gap:26px;padding:14px 0 16px;color:var(--act)}
.exf .add{flex:1;display:flex;align-items:center;gap:10px;font-size:24px;font-weight:500;text-align:left}
.exf .ic{width:28px;height:28px}
.fill{fill:var(--act);stroke:none}
.addex{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:28px;padding:16px 18px;color:var(--act);font-size:24px;font-weight:500}
.addex .ic{width:30px;height:30px}
/* keypad + toolbar */
#kp{position:fixed;left:0;right:0;bottom:0;z-index:8;max-width:560px;margin:0 auto}
#tb{display:none}
#tb.kbd{display:block;position:fixed;left:0;right:0;z-index:9;max-width:560px;margin:0 auto}
#tb.anch{display:block;position:absolute;left:0;right:0;z-index:9;pointer-events:none}
#tb.anch .kpbar{padding:0 10px;pointer-events:none}
#tb.anch .kpbar>*{pointer-events:auto}
.ex,.card{position:relative}
#tb .kpbar .pill,#tb .kpbar .circ{box-shadow:0 4px 18px rgba(0,0,0,.6);border-color:#3a3a3c}
.kpbar{display:flex;justify-content:space-between;padding:0 16px 10px}
.kpbar .pill{gap:0;padding:0 6px;height:52px;border-radius:26px;background:#141416}
.kpbar .pill button{width:62px;height:52px;display:grid;place-items:center}
.kpbar .pill button[disabled]{opacity:.35}
.kpbar .pill button[hidden]{display:none}
.kpbar .circ{width:52px;height:52px;background:#141416}
.kpbar .ic{width:28px;height:28px}
.keys{background:#2a2a2c;border-radius:30px 30px 0 0;padding:20px 6px calc(env(safe-area-inset-bottom) + 30px);display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.keys button{height:48px;border-radius:8px;background:var(--key);font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.keys button small{font-size:9px;letter-spacing:2.5px;margin-top:2px;font-weight:600}
.keys button.nb{background:none}
.keys button:active{background:#8e8e93}
.keys button.nb:active{background:#3a3a3c}
/* mini timer */
.mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);width:min(520px,calc(100% - 24px));height:58px;border-radius:29px;background:rgba(20,20,22,.95);border:1px solid #2c2c2e;display:flex;align-items:center;padding:0 10px;z-index:6;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.mini .tm{flex:1;text-align:center;font:600 26px ui-monospace,"SF Mono",Menlo,monospace}
.mini .pp{width:40px;height:40px;border-radius:50%;background:var(--ac);color:var(--acd);display:grid;place-items:center}
.mini .x{width:40px;height:40px;display:grid;place-items:center}
.mini.done{background:var(--ac);color:var(--acd)}
/* sheets */
#ov:empty{display:none}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.ovl.center{align-items:center;padding:20px}
.sheet{background:var(--sheet);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:calc(100% - env(safe-area-inset-top) - 30px);display:flex;flex-direction:column;animation:up .22s ease-out;position:relative}
.sheet.tall{height:calc(100% - env(safe-area-inset-top) - 30px)}
.sheet.full{height:100%;max-height:100%;border-radius:0;padding-top:calc(env(safe-area-inset-top) + 12px);background:#000}
.sheet.black{background:#000}
.dialog{background:var(--sheet);border-radius:20px;max-width:340px;width:100%;padding:20px 16px 12px;text-align:center;animation:up .18s ease-out}
.dialog h3{margin:0 0 6px;font-size:19px}
.dialog p{margin:0 0 16px;color:var(--val);font-size:16px}
.dialog button{display:block;width:100%;padding:14px;border-radius:14px;font-size:18px;margin-top:8px;background:#2c2c2e;color:var(--act)}
.dialog button.pri{background:var(--ac);color:var(--acd);font-weight:600}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet,.dialog{animation:none}.caret{animation:none}}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:46px}
.sh .ttl{flex:1;font-size:21px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh .pill,.sh .circ{background:#141416}
.search{display:flex;align-items:center;gap:10px;background:#141416;border-radius:24px;padding:0 16px;height:50px;color:var(--muted);flex:none}
.search input{font-size:19px}
.search input::placeholder{color:var(--muted)}
.scroll{overflow-y:auto;flex:1;min-height:0;margin:8px -16px 0;padding:0 16px 90px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 0;border-bottom:1px solid var(--line);font-size:21px;min-height:58px}
.li:first-child{border-top:1px solid var(--line)}
.li .nm{flex:1}
.li .nm small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.li .chev{color:var(--muted)}
.li .ib{color:var(--fg);padding:4px 0 4px 10px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.chk.on{background:var(--ac);border-color:var(--ac);color:var(--acd)}
.chk .ic{width:16px;height:16px;stroke-width:3}
.floatseg{position:absolute;left:28px;bottom:calc(env(safe-area-inset-bottom) + 22px);display:flex;gap:10px;align-items:center}
.seg{display:flex;background:#141416;border:1px solid #2c2c2e;border-radius:26px;padding:5px}
.seg button{padding:10px 16px;border-radius:21px;font-size:17px}
.seg button.on{background:var(--card2)}
.seg.ac button.on{background:var(--ac);color:var(--acd)}
.addbtn{background:var(--ac);color:var(--acd);font-weight:600;border-radius:26px;padding:14px 20px}
.grp{background:#2c2c2e;border-radius:16px;overflow:hidden;margin-bottom:14px}
.grp>button,.grp>div.row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px;font-size:19px;border-bottom:1px solid var(--line);text-align:left;gap:10px}
.grp>:last-child{border-bottom:0}
.grp .red{color:var(--red)}
.grp .ic{color:var(--fg);width:22px;height:22px}
.grp .vr{color:var(--muted);font-size:17px}
.trio{display:flex;background:#2c2c2e;border-radius:16px;overflow:hidden;margin-bottom:14px}
.trio button{flex:1;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;border-right:1px solid var(--line)}
.trio button:last-child{border-right:0}
.trio .ic{width:22px;height:22px}
.trio .red{color:var(--red)}
.sect{font-size:17px;color:var(--muted);margin:4px 0 8px 4px}
.menu{background:#2c2c2e;border-radius:16px;overflow:hidden;margin-bottom:10px}
.menu button{display:block;width:100%;padding:17px;font-size:19px;border-bottom:1px solid var(--line);text-align:center;color:var(--act)}
.menu button:last-child{border-bottom:0}
.menu button.red{color:var(--red)}
.menu .mt{padding:12px 16px;font-size:14px;color:var(--muted);text-align:center;border-bottom:1px solid var(--line)}
.cancel{display:block;width:100%;padding:17px;font-size:19px;font-weight:600;background:#2c2c2e;border-radius:16px;color:var(--act)}
.form label{display:block;font-size:14px;color:var(--muted);margin:16px 0 8px}
.tin{background:#141416;border-radius:12px;padding:13px 14px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:18px;padding:8px 14px;font-size:16px}

/* ---------- motion (iOS-style springs, plain shading) ---------- */
:root{--ease:cubic-bezier(.32,.72,0,1)}

.ghost.over{z-index:6}
.ghost.down{animation:slideDown .8s var(--ease) forwards}
.ghost.fade{animation:fadeAway .6s ease forwards}

#app.rise{animation:rise .84s var(--ease);transform-origin:50% 30vh}

const exById = id => S.exercises.find(e => e.id === id);

const NUMS = ['w','r','d','t'];
const hasNums = s => NUMS.some(c => !blank(s[c]));
const setEmpty = s => !hasNums(s) && !(s.n || '').trim();
const cloneSet = s => ({w:s.w, r:s.r, d:s.d, t:s.t, n:s.n || '', f:!!s.f, type:s.type || 'normal', drops:(s.drops || []).map(d => ({w:d.w, r:d.r, f:!!d.f}))});

function fmtTime(sec){
  if (blank(sec)) return '';
  sec = Math.round(sec);
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}
const clock = sec => `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
const digitsToSec = d => { if (!d) return null; const s = +d.slice(-2), m = +(d.slice(-4,-2)||0), h = +(d.slice(0,-4)||0); return h*3600 + m*60 + s; };
const secToDigits = sec => blank(sec) ? '' : fmtTime(sec).replace(/:/g,'').replace(/^0+/,'');
const digitsDisplay = d => { if (!d) return ''; const p = d.padStart(3,'0'); const s = p.slice(-2), rest = p.slice(0,-2); if (rest.length <= 2) return `${+rest}:${s}`; return `${+rest.slice(0,-2)}:${rest.slice(-2)}:${s}`; };
const fmtVal = (c, v) => blank(v) ? '' : c === 't' ? fmtTime(v) : String(v);
const dt = ts => new Date(ts);
const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const fmtStart = ts => dt(ts).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) + ' at ' + dt(ts).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const localInput = ts => { const d = dt(ts); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,16); };
function fmtSet(s, ex){
  const c = colsOf(ex), p = [], u = wUnit(ex);
  const one0 = (x) => {
    if (ex?.type === 'bw' && !blank(x.r)) return +x.w ? `+${x.w}×${x.r}` : `${x.r} reps`;
    if (c.includes('w') && c.includes('r') && !blank(x.r)) return `${blank(x.w) ? 0 : x.w}×${x.r}`;
    return c.filter(k => !blank(x[k])).map(k => k === 't' ? fmtTime(x[k]) : k === 'r' ? `${x[k]} reps` : `${x[k]} ${k === 'w' ? u : dUnit(ex)}`).join(' · ');
  };
  const one = x => { const t = one0(x); return t && x.f ? t + ' (F)' : t; };
  p.push(one(s));
  (s.drops || []).forEach(d => { if (!blank(d.w) || !blank(d.r)) p.push(one(d)); });
  return p.filter(Boolean).join(' → ') + (s.type === 'warmup' ? ' (W)' : '');
}
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1700); }

// the variation an exercise instance is actually using (defaults: Together + Free weight)
function effVar(ex, it){
  const mo = ex?.modeOpt || 'any', eo = ex?.equipOpt || 'any';
  return {
    mode: mo === 'none' ? null : mo === 'any' ? (it?.mode || 'together') : mo,
    equip: eo === 'none' ? null : eo === 'any' ? (it?.equip || 'free') : eo
  };
}
const varKey = (ex, it) => { const v = effVar(ex, it); return v.mode + '|' + v.equip; };
const varLabel = (ex, it) => { const v = effVar(ex, it); return [v.equip && EQUIP[v.equip], v.mode && MODES[v.mode]].filter(Boolean).join(' · '); };
function lastSets(exId, w, it){
  const ex = exById(exId), key = varKey(ex, it);
  const prev = S.workouts.filter(o => o.id !== w.id && o.start < w.start).sort((a,b) => b.start - a.start);
  for (const o of prev){
    const p = o.items.find(x => x.exId === exId && varKey(ex, x) === key && x.sets.some(hasNums));
    if (p) return p.sets.filter(s => !setEmpty(s));
  }
  return null;
}
const srcSets = (it, w) => it.target || lastSets(it.exId, w, it);
// iso = one side at a time, logged per side; stats count it as both sides (weight x2)
const isoF = (ex, it) => effVar(ex, it).mode === 'iso' ? 2 : 1;
const scaleSet = (s, f) => f === 1 || blank(s.w) ? s : {...s, w: +s.w * f, drops: (s.drops || []).map(d => blank(d.w) ? d : {...d, w: +d.w * f})};
function sessionsFor(exId){
  const ex = exById(exId);
  return S.workouts.slice().sort((a,b) => a.start - b.start)
    .map(w => ({w, sets: w.items.filter(it => it.exId === exId).flatMap(it => { const f = isoF(ex, it); return it.sets.filter(hasNums).map(s => scaleSet(s, f)); })}))
    .filter(x => x.sets.length);
}
function cleanWorkout(w){
  w.items.forEach(it => {
    it.sets.forEach(s => { if (s.drops) s.drops = s.drops.filter(d => !blank(d.w) || !blank(d.r)); });
    it.sets = it.sets.filter(s => !setEmpty(s));
  });
  w.items = w.items.filter(it => it.sets.length || (it.note || '').trim());
}
const setNumber = (it, j) => it.sets[j].type === 'warmup' ? '' : it.sets.slice(0, j+1).filter(s => s.type !== 'warmup').length;

/* ---------- cell model ---------- */
// f = {i, j, c, k}  k = -1 main pair, k >= 0 drop pair index;  or {bw:true}
const fKey = f => f.name ? 'name' : f.bw ? 'bw' : `${f.i}_${f.j}_${f.c}_${f.k ?? -1}`;
const fSel = f => f.bw ? '[data-bw]' : `[data-a=cell][data-f="${fKey(f)}"]`;
function getV(f){ if (f.bw) return W().bw; const s = W().items[f.i].sets[f.j]; return (f.k ?? -1) >= 0 ? s.drops[f.k][f.c] : s[f.c]; }
function setV(f, v){ if (f.bw){ W().bw = v; return; } const s = W().items[f.i].sets[f.j]; if ((f.k ?? -1) >= 0) s.drops[f.k][f.c] = v; else s[f.c] = v; }
function phV(f){
  if (f.bw) return null;
  const w = W(), it = w.items[f.i], src = srcSets(it, w), k = f.k ?? -1;
  const ps = src?.[f.j];
  let v = k >= 0 ? ps?.drops?.[k]?.[f.c] : ps?.[f.c];
  return v;
}
const isF = f => ui.kp && fKey(ui.kp) === fKey(f);
// does this set still show faded data from the previous workout in any field?
function hasFaded(i, j){
  const w = W(), it = w.items[i], s = it?.sets[j], p = it && srcSets(it, w)?.[j];
  if (!s || !p) return false;
  const cols = colsOf(exById(it.exId));
  if (cols.some(c => blank(s[c]) && !blank(p[c]))) return true;
  if (!(s.n || '').trim() && (p.n || '').trim()) return true;
  return (s.drops || []).some((d, k) => cols.some(c => blank(d[c]) && !blank(p.drops?.[k]?.[c])));
}
// the focused number field is empty but last workout has a value for it
const fieldFaded = f => !!f && !f.bw && !f.name && f.c !== 'n' && blank(getV(f)) && ui.buf === '' && !blank(phV(f));
const noteFaded = (i, j) => { const w = W(), it = w.items[i], p = srcSets(it, w)?.[j]; return !(it.sets[j].n || '').trim() && !!(p?.n || '').trim(); };
function cellInner(f){
  const col = f.bw ? 'w' : f.c;
  if (isF(f) && col === 'n') return `${esc(ui.buf)}<span class="caret"></span>`;
  if (isF(f)){
    const txt = col === 't' ? digitsDisplay(ui.buf) : ui.buf;
    if (!txt && !f.bw){ const ph = phV(f); if (!blank(ph)) return `<span class="caret"></span><span class="ph">${esc(fmtVal(col, ph))}</span>`; }
    return ui.fresh && txt ? `<span class="caret"></span><span class="sel">${esc(txt)}</span>` : `${esc(txt)}<span class="caret"></span>`;
  }
  const v = getV(f);
  if (!blank(v)) return esc(fmtVal(col, v));
  const ph = phV(f);
  return blank(ph) ? '' : `<span class="ph">${esc(fmtVal(col, ph))}</span>`;
}
const cellBtn = (f, cls='', label='') => `<button class="cell ${f.c === 't' ? 't' : ''} ${cls} ${isF(f) ? 'f' : ''}" data-a="cell" data-f="${fKey(f)}">${label}<div class="vv">${cellInner(f)}</div></button>`;

/* ---------- routines ---------- */
const RT_TYPES = [['warmup', 'Warm-up'], ['normal', 'Regular'], ['drop', 'Drop set']];
const FOLDER_IC = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>';

function rtSummary(r){

function routinesTab(){
  let h = `<div class="sticky" id="hbar"><div class="bar" style="position:relative"><span style="width:46px"></span><span class="htitle">Routines</span><span class="sp"></span>
      <button class="circ" data-a="rtAdd" aria-label="New">${I.plus}</button></div></div><h1 id="bigt">Routines</h1>`;
  if (!S.routines.length && !S.folders.length) return h + `<div class="empty">No routines yet.<br>Tap + to make a routine or a folder.</div>`;
  const row = r => `<div class="rsw" data-rid="${r.id}"><button class="sdel" data-a="rtSwDel" data-id="${r.id}" tabindex="-1">Delete</button><div class="rtr"><button class="rtrb" data-a="rtOpen" data-id="${r.id}"><b>${esc(r.name || 'Untitled routine')}</b><small>${esc(rtSummary(r))}</small></button><button class="pill rts" data-a="rtStart" data-id="${r.id}">Start</button></div></div>`;
  S.folders.forEach(f => {
    const rs = S.routines.filter(r => r.folder === f.id), open = f.open !== false;
    h += `<div class="card rtf"><div class="fsw" data-fid="${f.id}"><button class="sdel" data-a="fSwDel" data-id="${f.id}" tabindex="-1">Delete</button><div class="rtfh"><button class="rtft" data-a="rtFolderTog" data-id="${f.id}"><span class="fic">${FOLDER_IC}</span><span class="sp">${esc(f.name)}</span><span class="v">${rs.length}</span><span class="chv ${open ? 'open' : ''}">${I.right}</span></button>
      <button class="ib" data-a="rtFolderMenu" data-id="${f.id}" aria-label="Folder options">${I.dots}</button></div></div>
      ${open ? (rs.length ? rs.map(row).join('') : '<div class="rte">Empty folder</div>') : ''}</div>`;
  });
  const loose = S.routines.filter(r => !r.folder || !S.folders.some(f => f.id === r.folder));
  if (loose.length) h += `${S.folders.length ? '<div class="sect" style="margin:18px 6px 6px">Not in a folder</div>' : ''}<div class="card rtf">${loose.map(row).join('')}</div>`;
  return h;
}
function routineView(){
  const r = W(), f = S.folders.find(x => x.id === r.folder);
  let h = `<div class="sticky"><div class="bar"><button class="circ" data-a="rtClose" aria-label="Back">${I.left}</button><span class="wdate" style="flex:1;text-align:center">Routine</span>
      <button class="circ" data-a="rtMenu" aria-label="More">${I.dots}</button></div></div>
    <div class="card" style="margin-top:8px">
      <input class="name" data-k="wname" placeholder="Routine name" value="${esc(r.name || '')}" autocomplete="off" enterkeyhint="done">
      <button class="frow" data-a="rtMoveSel"><span>Folder</span><span class="v" style="display:flex;align-items:center;gap:6px">${esc(f ? f.name : 'None')}${I.right}</span></button>
    </div>`;
  const block = (i, k, multi) => {
    const it = r.items[i], ex = exById(it.exId) || {name: 'Deleted exercise'};
    return `<div class="rtx"><div class="exh"><div class="t">${multi ? `<span class="rgl">${LET(k)}</span> ` : ''}${esc(ex.name)}${it.note ? `<span>${esc(it.note)}</span>` : ''}${varToggles(i)}</div>
        <button class="dots" data-a="exMenu" data-i="${i}" aria-label="Exercise options">${I.dots}</button></div>
      ${RT_TYPES.map(([t, l]) => `<div class="rst"><span>${l}${t === 'normal' && multi ? ' rounds' : ''}</span><div class="stp"><button data-a="rtStep" data-i="${i}" data-t="${t}" data-d="-1" ${rtCount(it, t) ? '' : 'disabled'} aria-label="Fewer">−</button><b>${rtCount(it, t)}</b><button data-a="rtStep" data-i="${i}" data-t="${t}" data-d="1" aria-label="More">+</button></div></div>`).join('')}</div>`;
  };
  r.items.forEach((it, i) => {
    const g = groupOf(r, i); if (g[0] !== i) return;
    h += `<section data-ex="${i}" class="ex rtc">${g.length > 1 ? '<div class="rtss">Superset</div>' : ''}${g.map((x, k) => block(x, k, g.length > 1)).join('<div class="rtsep"></div>')}</section>`;
  });
  h += `<button class="addex" data-a="openPicker">${I.plusc}Add Exercise</button>
    <button class="btn" data-a="rtStartCur" ${r.items.length ? '' : 'disabled'} style="margin:10px 0 30px">Start as Workout</button>`;
  return h;
}
function rtRemove(id){ collapse($(`.rsw[data-rid="${id}"]`), () => { S.routines = S.routines.filter(r => r.id !== id); save(); render(); }); }
function folderRemove(id, asked){
  const n = S.routines.filter(r => r.folder === id).length, f = S.folders.find(x => x.id === id);
  if (n && !asked){ menu(`Delete ${f.name} and the ${n} routine${n === 1 ? '' : 's'} in it?`, [{label:'Delete Folder', red:true, fn(){ ui.sheet = null; renderSheet(); folderRemove(id, true); }}]); closeSwipe(); render(); return; }
  collapse($(`.fsw[data-fid="${id}"]`)?.closest('.rtf'), () => { S.routines = S.routines.filter(r => r.folder !== id); S.folders = S.folders.filter(x => x.id !== id); save(); render(); });
}
function rtNew(folder){
  const r = {id: uid(), name: '', folder: folder || null, items: []};
  S.routines.push(r); save(); openRoutine(r.id);
}
function openRoutine(id){ transition('up', () => { ui.screen = 'routine'; ui.rid = id; ui.sheet = null; ui.kp = null; render(); scrollTo(0, 0); }); }
function routineToWorkout(r){
  const ss = {};
  const items = r.items.filter(it => exById(it.exId) && !exById(it.exId).deleted).map(it => ({id: uid(), exId: it.exId, ss: it.ss ? (ss[it.ss] ||= uid()) : null, note: it.note || '',
    ...(it.mode ? {mode: it.mode} : {}), ...(it.equip ? {equip: it.equip} : {}),
    sets: (it.sets.length ? it.sets : [{type: 'normal'}]).map(s => s.type === 'drop' ? {type: 'drop', drops: [{}]} : {type: s.type || 'normal'})}));
  const w = newWorkoutObj(items); w.name = r.name || ''; return w;
}
function rtStartWorkout(r){
  const w = routineToWorkout(r); S.workouts.push(w); S.active = w.id; save(); openWorkout(w.id);
}
function rtFromWorkout(w){
  const ss = {};
  const r = {id: uid(), name: w.name || '', folder: null, items: w.items.map(it => ({id: uid(), exId: it.exId, ss: it.ss ? (ss[it.ss] ||= uid()) : null, note: it.note || '',
    ...(it.mode ? {mode: it.mode} : {}), ...(it.equip ? {equip: it.equip} : {}), sets: it.sets.map(s => ({type: s.type || 'normal'}))}))};
  S.routines.push(r); save(); return r;
}
function nameSheetHTML(){
  const sh = ui.sheet;
  return `<div class="sh"><button class="pill" data-a="closeSheet">Cancel</button><span class="ttl">${esc(sh.title)}</span><button class="pill ac" data-a="nameSave">Save</button></div>
    <input class="nmin" id="nmin" value="${esc(sh.value || '')}" placeholder="${esc(sh.ph || 'Name')}" autocomplete="off" enterkeyhint="done">`;
}

/* ---------- home ---------- */
function homeView(){
  if (ui.tab === 'routines') return routinesTab();
  if (ui.tab !== 'log') return otherTab();
  const ws = S.workouts.slice().sort((a,b) => b.start - a.start);
  let h = `<div class="sticky" id="hbar"><div class="bar" style="position:relative">
      <button class="pill" data-a="toggleEdit">${ui.edit ? 'Done' : 'Edit'}</button><span class="htitle">Log</span><span class="sp"></span>
      <button class="circ" data-a="calendar" aria-label="Calendar">${I.cal}</button>
      <button class="circ" data-a="newWorkout" aria-label="New workout">${I.plus}</button>
    </div></div><h1 id="bigt">Log</h1>`;
  if (!ws.length) return h + `<div class="empty">No workouts yet.<br>Tap + to start one.</div>`;
  const groups = [];
  ws.forEach(w => {
    const d = dt(w.start), key = d.getFullYear() + '-' + d.getMonth();
    let g = groups[groups.length-1];
    if (!g || g.key !== key){ g = {key, label:d.toLocaleDateString('en-US',{month:'long',year:'numeric'}), ws:[]}; groups.push(g); }
    g.ws.push(w);
  });
  groups.forEach(g => {
    h += `<div class="mh"><span>${esc(g.label)}</span><span>${g.ws.length} Workout${g.ws.length === 1 ? '' : 's'}</span></div><div class="wl">`;
    g.ws.forEach(w => {
      const d = dt(w.start), live = !w.end;
      const mins = w.end && w.end > w.start ? Math.max(1, Math.round((w.end - w.start)/60000)) + ' min' : '';
      const lines = w.items.map(it => `${it.sets.filter(s => !setEmpty(s)).length || it.sets.length}x ${esc(exById(it.exId)?.name || 'Deleted exercise')}`).join('<br>');
      h += `<div class="hw" data-w="${w.id}"><button class="sdel" data-a="wSwDel" data-id="${w.id}" tabindex="-1">Delete</button><button class="wr" data-a="${ui.edit ? 'askDelW' : 'openW'}" data-id="${w.id}">
        ${ui.edit ? `<span class="del">${I.minus}</span>` : ''}
        <span class="badge"><span>${d.toLocaleDateString('en-US',{weekday:'short'})}</span><b>${d.getDate()}</b></span>
        <span style="flex:1"><span class="wt"><span>${esc(w.name || 'Workout')}</span>${live ? '<em class="live">In progress</em>' : mins ? `<em>${mins}</em>` : ''}</span>
        <span class="wx">${lines || '<span style="color:var(--muted)">No exercises</span>'}</span></span></button></div>`;
    });
    h += `</div>`;
  });
  return h;
}
function tabBar(){
  const t = [['log','Log',I.tLog],['routines','Routines',I.tRout],['stats','Statistics',I.tStat],['profile','Profile',I.tProf]];
  return `<nav class="tabs">${t.map(([k,l,ic]) => `<button class="${ui.tab===k?'on':''}" data-a="tab" data-t="${k}">${ic}${l}</button>`).join('')}</nav>`;
}
function otherTab(){
  const title = {routines:'Routines', stats:'Statistics', profile:'Profile'}[ui.tab];
  let body = `<div class="empty">Coming soon.</div>`;
  if (ui.tab === 'profile'){
    const seg = (k, opts) => `<div class="seg">${opts.map(o => `<button class="${S.settings[k]===o?'on':''}" data-a="unit" data-k="${k}" data-v="${o}">${o}</button>`).join('')}</div>`;
    body = `<div class="card"><div class="frow"><span>Weight</span>${seg('w',['lb','kg'])}</div><div class="frow"><span>Distance</span>${seg('d',['mi','km'])}</div></div>
      ${S.workouts.some(w => w.sample) ? `<div class="card"><button class="frow" data-a="sampleClear" style="color:var(--red)">Remove sample workouts</button></div>` : ''}
      <div class="card"><button class="frow" data-a="exManage"><span>Exercises</span><span class="v" style="display:flex;align-items:center;gap:6px">${S.exercises.filter(e => !e.deleted).length}${I.right}</span></button>
        <button class="frow" data-a="musOpen"><span>Muscles</span><span class="v" style="display:flex;align-items:center;gap:6px">${S.muscles.length}${I.right}</span></button></div>
      <div class="card"><button class="frow" data-a="impOpen"><span>Import workouts</span>${I.right}</button>
        <button class="frow" data-a="backup"><span>Back up all data</span>${I.right}</button></div>
      <div class="card"><button class="frow" data-a="askReset" style="color:var(--red)">Erase all data</button></div>
      <div class="ver">Workout Log · Version ${REV}</div>`;
  }
  if (ui.tab === 'stats'){
    const nEx = S.exercises.filter(e => !e.deleted && sessionsFor(e.id).length).length;
    body = `${bodyCard()}<div class="card"><button class="frow" data-a="exStats"><span>Exercises</span><span class="v" style="display:flex;align-items:center;gap:6px">${nEx}${I.right}</span></button>
      <button class="frow" data-a="musStats"><span>Muscles</span><span class="v" style="display:flex;align-items:center;gap:6px">${S.muscles.length}${I.right}</span></button></div>
      ${statsGrid()}`;
  }
  return `<div class="bar"></div><h1>${title}</h1>${body}`;
}

const REGION_NAMES = {chestUpper:'Upper chest', chest:'Chest', obliques:'Obliques', absUpper:'Upper abs', absLower:'Lower abs', abductors:'Abductors', biceps:'Biceps', triceps:'Triceps', neck:'Neck', frontDelts:'Front delts', sideDelts:'Side delts', rearDelts:'Rear delts',
  adductors:'Adductors', quads:'Quads', calves:'Calves', forearm:'Forearms', traps:'Traps', upperBack:'Upper back', lowerBack:'Lower back', glutes:'Glutes', hamstrings:'Hamstrings'};
// which body regions each of your muscles lights up (matched by name, so added muscles work if they use common words)
function regionsFor(name){
  const n = name.toLowerCase(), has = w => n.includes(w), out = [];
  if (has('upper chest') || has('upper pec') || has('clavicular')) out.push('chestUpper');
  else if (has('lower chest') || has('lower pec')) out.push('chest');
  else if (has('chest') || has('pec')) out.push('chestUpper', 'chest');
  if (has('side delt') || has('lateral delt') || has('middle delt')) out.push('sideDelts');
  else if (has('rear delt') || has('back delt')) out.push('rearDelts');
  else if (has('front delt')) out.push('frontDelts');
  else if (has('delt') || has('shoulder')) out.push('frontDelts', 'sideDelts', 'rearDelts');
  if (has('bicep')) out.push('biceps');
  if (has('tricep')) out.push('triceps');
  if (has('forearm') || has('grip')) out.push('forearm');
  if (has('oblique')) out.push('obliques');
  if (has('upper ab')) out.push('absUpper');
  else if (has('lower ab')) out.push('absLower');
  else if (/\babs\b|\babdominal|\bcore\b/.test(n)) out.push('absUpper', 'absLower');
  if (has('trap')) out.push('traps');
  if (/\blats?\b/.test(n) || has('upper back') || has('rhomboid')) out.push('upperBack');
  if (has('lower back') || has('erector')) out.push('lowerBack');
  if (has('abductor') || has('glute med') || has('hip ab')) out.push('abductors');
  else if (has('glute')) out.push('glutes');

function workoutCSV(w){
  const q = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const rows = [['date','workout','exercise','variation','set','type','weight','weight_unit','reps','distance','distance_unit','time','failure','notes']];
  const date = new Date(w.start - new Date(w.start).getTimezoneOffset()*6e4).toISOString().slice(0, 10);
  w.items.forEach(it => {
    const ex = exById(it.exId) || {name:'Exercise', type:'wr'};

      const n = setNumber(it, j) || 'W', type = x.type || 'normal';
      const row = (lbl, p, note) => rows.push([date, w.name || '', ex.name, varLabel(ex, it), lbl, type, p.w ?? '', blank(p.w) ? '' : wUnit(ex), p.r ?? '', p.d ?? '', blank(p.d) ? '' : dUnit(ex), fmtTime(p.t), p.f ? 'yes' : '', note]);

}

/* ---------- summary ---------- */
function summaryStats(w){
  let vol = 0, sets = 0, reps = 0;
  const per = [];
  w.items.forEach(it => {
    const ex = exById(it.exId), bw = ex?.type === 'bw', f = isoF(ex, it);
    let best = null;
    it.sets.forEach(s => {
      if (!hasNums(s)) return;
      sets++;
      [s, ...(s.drops || [])].forEach(p => {
        const r = +p.r || 0, wt = (bw ? (+w.bw || 0) : 0) + (+p.w || 0) * f;
        reps += r; vol += wt * r;
      });
      if (!best || (+s.w||0) > (+best.w||0) || ((+s.w||0) === (+best.w||0) && (+s.r||0) > (+best.r||0))) best = s;
    });
    if (best) per.push({ex, n:it.sets.filter(hasNums).length, best});
  });
  return {vol, sets, reps, per};
}

// arrows only move within the current exercise's sets (left→right, then down), stopping at its first and last field

function records(ex, ses){

  const top = f => all.filter(s => !blank(s[f])).sort((a,b) => b[f] - a[f] || (b.r||0) - (a.r||0))[0];
  const plain = s => fmtSet({...s, drops:[], type:'normal'}, ex);
  if (c.includes('w')){ const b = top('w'); if (b) out.push([ex.type === 'bw' ? 'Most added weight' : 'Heaviest', plain(b)]); }
  if (c.includes('w') && c.includes('r') && ex.type !== 'bw'){
    const e = all.filter(s => s.w && s.r).map(s => ({v: s.w * (1 + s.r/30)})).sort((a,b) => b.v - a.v)[0];
    if (e) out.push(['Est. 1-rep max', `${Math.round(e.v)} ${u}`]);
    const vol = ses.map(x => x.sets.reduce((a,s) => a + [s, ...(s.drops||[])].reduce((b,p) => b + (p.w||0)*(p.r||0), 0), 0)).sort((a,b) => b - a)[0];
    if (vol) out.push(['Best workout volume', `${vol.toLocaleString()} ${u}`]);
  }
  if (c.includes('r')){ const b = top('r'); if (b) out.push(['Most reps', plain(b)]); }
  if (c.includes('d')){ const b = top('d'); if (b) out.push(['Longest distance', plain(b)]); }

const DATE_RE = /^(?:(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*,?\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2},?\s+\d{4}\b/i;

      if (!ex){

function transition(kind, doRender){
  if (RM){ doRender(); return; }
  const app = $('#app'), y = scrollY;
  const ghost = document.createElement('div'); ghost.className = 'ghost';
  const gi = app.cloneNode(true); gi.removeAttribute('id'); gi.className = ''; gi.style.cssText = `transform:translateY(${-y}px);background:#000;min-height:100vh`;
  const src = [...app.querySelectorAll('input,textarea')], dst = [...gi.querySelectorAll('input,textarea')];
  src.forEach((s, k) => { if (dst[k]){ if (s.tagName === 'TEXTAREA') dst[k].textContent = s.value; else dst[k].setAttribute('value', s.value); } });
  gi.querySelectorAll('.sticky').forEach(e => { e.style.position = 'relative'; e.style.top = y + 'px'; });
  ghost.appendChild(gi);
  const nav = $('#nav').firstElementChild; if (nav) ghost.appendChild(nav.cloneNode(true));

    if (sh.mode === 'superset'){
      const k = sh.sel.indexOf(d.id); k < 0 ? sh.sel.push(d.id) : sh.sel.splice(k, 1);
      const sc = $('#plist').scrollTop; renderSheet(); $('#plist').scrollTop = sc;
    } else addItems([d.id]);
  },
  addSuperset(){ if (!ui.sheet.sel.length) return; addItems(ui.sheet.sel.slice(), ui.sheet.sel.length > 1 ? uid() : null); },
  createEx(){ ui.anim = 'push'; const p = ui.sheet; ui.sheet = createSheet(p, null, p.q.trim(), p.cat || 'Chest'); renderSheet(); },
  createBack(){ ui.anim = 'pop'; ui.sheet = ui.sheet.back; renderSheet(); },
  cMus(d){ const a = ui.sheet[d.l], k = a.indexOf(d.v); k < 0 ? a.push(d.v) : a.splice(k, 1); const other = d.l === 'prim' ? 'sec' : 'prim'; if (k < 0) ui.sheet[other] = ui.sheet[other].filter(x => x !== d.v); keepScroll(); },
  cOpt(d){ ui.sheet[d.f] = d.v; keepScroll(); },
  cCat(d){ ui.sheet.cat = d.v; keepScroll(); },
  cType(d){ ui.sheet.etype = d.v; keepScroll(); },
  cSave(){
    const c = ui.sheet, name = c.name.trim();
    const err = m => { $('#cerr').textContent = m; };
    if (!name) return err('Enter a name.');
    if (S.exercises.some(e => !e.deleted && e.id !== c.editId && e.name.toLowerCase() === name.toLowerCase())) return err('An exercise with that name already exists.');
    const fields = {name, cat:c.cat, type:c.etype, prim:c.prim, sec:c.sec, modeOpt:c.modeOpt, equipOpt:c.equipOpt};
    if (c.editId){ Object.assign(exById(c.editId), fields); save(); ui.sheet = c.back; ui.anim = 'pop'; render(); return; }
    const ex = {id:uid(), ...fields, custom:true};
    S.exercises.push(ex); save();
    const p = c.back;
    if (p.type === 'exManage'){ p.cat = ex.cat; p.q = ''; ui.sheet = p; ui.anim = 'pop'; renderSheet(); return; }
    if (p.replace !== undefined){ const it = W().items[p.replace]; it.exId = ex.id; it.target = null; save(); ui.sheet = null; render(); }
    else if (p.mode === 'superset'){ p.sel.push(ex.id); p.cat = ex.cat; p.q = ''; ui.sheet = p; renderSheet(); }
    else addItems([ex.id]);
  },
  cxMenu(d){
    const p = ui.sheet, ex = exById(d.id);
    menu(ex.name, [
      {label:'Edit Exercise', fn(){ ui.sheet = createSheet(p, ex); renderSheet(); }},
      {label:'History', fn(){ ui.sheet = {type:'info', exId:ex.id, tab:'history'}; renderSheet(); }},
      {label:'Delete Exercise', red:true, fn(){ ex.deleted = true; p.sel = p.sel.filter(x => x !== ex.id); save(); ui.sheet = p; renderSheet(); }}
    ]);
  },
  info(d){ ui.kp = null; if (ui.screen === 'workout'){ refreshCells(); renderKP(); } const ids = d.ex.split(','); ui.sheet = {type:'info', exId:ids[0], exIds:ids, tab:d.tab}; renderSheet(); },
  infoEx(d){ ui.sheet.exId = d.ex; renderSheet(); },
  infoTab(d){ ui.sheet.tab = d.tab; renderSheet(); },
  menuPick(d){ ui.menu[+d.k].fn(); },
  closeSheet(){ closeSheet(); },
  unit(d){ S.settings[d.k] = d.v; save(); render(); },
  sampleClear(){ menu('Remove the sample workouts? Your own workouts stay.', [{label:'Remove Sample Workouts', red:true, fn(){ S.workouts = S.workouts.filter(w => !w.sample); saveNow(); ui.sheet = null; render(); }}]); },
  askReset(){ menu('Erase all workouts and custom exercises?', [{label:'Erase All Data', red:true, fn(){ S = defaultState(); saveNow(); ui.sheet = null; render(); }}]); }
};


// swipe a sheet down by its header to dismiss it
let drag = null, swallowClick = false;
document.addEventListener('touchstart', () => {}, {passive:true});
document.addEventListener('pointerdown', e => {
  const sheet = e.target.closest('#ov .sheet');
  if (!sheet || !e.target.closest('.sh, .grab') || ['menu','dialog','notes'].includes(ui.sheet?.type)) return;
  drag = {sheet, y0:e.clientY, t0:performance.now(), dy:0, on:false};
});
addEventListener('pointermove', e => {
  if (!drag) return;
  const dy = e.clientY - drag.y0;
  if (!drag.on && dy > 8){ drag.on = true; drag.sheet.style.transition = 'none'; drag.sheet.style.animation = 'none'; }
  if (drag.on){ drag.dy = Math.max(0, dy); drag.sheet.style.transform = `translateY(${drag.dy}px)`; }
});
function endDrag(){
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.on) return;
  swallowClick = true; setTimeout(() => { swallowClick = false; }, 350);
  const v = d.dy / Math.max(1, performance.now() - d.t0);
  d.sheet.style.transition = 'transform .57s cubic-bezier(.32,.72,0,1)';
  if (d.dy > 110 || v > .6){
    d.sheet.style.transform = 'translateY(100%)';
    d.sheet.parentElement.classList.add('fading');
    setTimeout(() => { $('#ov').dataset.drag = '1'; const t = ui.sheet?.type; if (['sound','editTimers','timerMenu'].includes(t)){ ui.sheet = null; renderSheet(); } else closeSheet(); }, 560);
  } else d.sheet.style.transform = '';
}
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);

// swipe a set left to reveal Delete (full swipe deletes)
let sw = null, openSwipe = null;
const closeSwipe = () => { if (openSwipe){ openSwipe.classList.remove('open'); const r = openSwipe.querySelector(':scope > .srow, :scope > .exh, :scope > .pair, :scope > .wr, :scope > .rtr, :scope > .rtfh'); if (r) r.style.transform = ''; openSwipe = null; } };
document.addEventListener('pointerdown', e => {
  const row = e.target.closest('.swr > .srow, .exw > .exh, .dwr > .pair, .hw > .wr, .rsw > .rtr, .fsw > .rtfh');
  if (openSwipe && (!row || row.parentElement !== openSwipe) && !e.target.closest('.sdel')){ closeSwipe(); swallowClick = true; setTimeout(() => { swallowClick = false; }, 350); return; }
  if (!row) return;
  sw = {wrap:row.parentElement, row, x0:e.clientX, y0:e.clientY, base: row.parentElement === openSwipe ? -92 : 0, dx:0, on:false, dead:false};
});
addEventListener('pointermove', e => {
  if (!sw || sw.dead) return;
  const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
  if (!sw.on){
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ sw.dead = true; return; }
    if (Math.abs(dx) > 10){ sw.on = true; sw.wrap.classList.add('dragging'); ui.kp && closeKP(); document.activeElement?.blur?.(); }
    else return;
  }
  let x = Math.min(0, sw.base + dx);
  if (x < -92) x = -92 + (x + 92) * .8;
  sw.dx = x; sw.row.style.transform = `translateX(${x}px)`;
});
function endSwipe(){
  if (!sw) return;
  const d = sw; sw = null;
  if (!d.on){ if (d.base){ closeSwipe(); swallowClick = true; setTimeout(() => { swallowClick = false; }, 350); } return; }
  d.wrap.classList.remove('dragging');
  swallowClick = true; setTimeout(() => { swallowClick = false; }, 350);
  const width = d.wrap.offsetWidth;
  if (d.dx < -width * .6){
    openSwipe = null;
    if (d.wrap.classList.contains('exw')){ d.row.style.transform = ''; exSwipeDelete(+d.wrap.dataset.i); return; }
    if (d.wrap.classList.contains('rsw')){ d.row.style.transform = `translateX(${-width}px)`; setTimeout(() => rtRemove(d.wrap.dataset.rid), 300); return; }
    if (d.wrap.classList.contains('fsw')){ d.row.style.transform = `translateX(${-width}px)`; setTimeout(() => folderRemove(d.wrap.dataset.fid), 300); return; }
    if (d.wrap.classList.contains('hw')){ d.row.style.transform = `translateX(${-width}px)`; setTimeout(() => removeWorkout(d.wrap.dataset.w), 300); return; }
    if (d.wrap.classList.contains('dwr')){ const [i, j, k] = d.wrap.dataset.drop.split('_').map(Number); d.row.style.transform = `translateX(${-width}px)`; setTimeout(() => removeDrop(i, j, k), 300); return; }
    const [i, j] = d.wrap.dataset.row.split('_').map(Number);
    d.row.style.transform = `translateX(${-width}px)`;
    setTimeout(() => removeSet(i, j), 340);
  } else if (d.dx < -46){ d.row.style.transform = 'translateX(-92px)'; openSwipe = d.wrap; d.wrap.classList.add('open'); }
  else { d.row.style.transform = ''; d.wrap.classList.remove('open'); if (openSwipe === d.wrap) openSwipe = null; }
}
addEventListener('pointerup', endSwipe);
addEventListener('pointercancel', endSwipe);
document.addEventListener('change', e => {
  if (e.target.id === 'impFile' && e.target.files[0]){ const r = new FileReader(); r.onload = () => { $("#impText").value = r.result; A.impPreview(); }; r.readAsText(e.target.files[0]); return; }
  const t = e.target; if (!t.matches?.('select[data-imp]') || ui.sheet?.type !== 'import') return;
  const m = ui.sheet.prep.map[t.dataset.imp], v = t.value;
  if (v.startsWith('new|')){ m.use = 'new'; m.cat = v.slice(4); } else m.use = v;
  const sc = $('.sheet .scroll')?.scrollTop; renderSheet(); const g = $('.sheet .scroll'); if (g && sc) g.scrollTop = sc;
});
document.addEventListener('scroll', e => { if (e.target.id === 'calsc') calTitle(); }, true);
document.addEventListener('click', e => {
  if (swallowClick){ swallowClick = false; return; }
  if (e.target.matches('input[type=file]')) return;  // let the file picker open
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (fn){ e.preventDefault(); fn(el.dataset, el); }
});
// keep focus in the notes field while tapping toolbar buttons
document.addEventListener('pointerdown', e => { if (e.target.closest('#kp button, #tb button:not([data-a=hideKb])')) e.preventDefault(); });

// iPhone-style letter popup while a key is held
let kpop = null;
function hidePop(){ if (kpop){ kpop.remove(); kpop = null; } }
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('#kp .txk button[data-a=tkey]');
  hidePop();
  if (!b || b.dataset.k.length !== 1) return;
  const r = b.getBoundingClientRect(), extra = 12, bw = r.width + extra * 2, bh = r.height * 1.15;
  let left = r.left - extra; left = Math.max(2, Math.min(left, innerWidth - bw - 2));
  kpop = document.createElement('div'); kpop.className = 'kpop';
  kpop.style.cssText = `left:${left}px;top:${r.top - bh + 4}px;width:${bw}px;height:${bh + r.height - 4}px`;
  const ch = ui.shift && !ui.sym ? b.dataset.k.toUpperCase() : b.dataset.k;
  kpop.innerHTML = `<div class="s" style="left:${r.left - left}px;top:${bh - 4}px;width:${r.width}px;height:${r.height}px"></div><div class="b" style="left:0;top:0;width:${bw}px;height:${bh}px"></div>`;
  kpop.querySelector('.b').textContent = ch;
  document.body.appendChild(kpop);
});
['pointerup','pointercancel'].forEach(ev => document.addEventListener(ev, () => setTimeout(hidePop, 60)));
// hold delete to keep deleting, like iOS
let delHold = null;
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('#kp [data-k=del]'); if (!b) return;
  const fn = b.dataset.a === 'tkey' ? () => tkey('del') : () => key('del');
  delHold = setTimeout(function rep(){ fn(); delHold = setTimeout(rep, 80); }, 450);
});
['pointerup','pointercancel','pointerleave'].forEach(ev => document.addEventListener(ev, () => { clearTimeout(delHold); delHold = null; }));
document.addEventListener('mousedown', e => { if (e.target.closest('#kp button, #tb button:not([data-a=hideKb])')) e.preventDefault(); });
document.addEventListener('input', e => {
  const t = e.target, k = t.dataset.k;
  if (!k) return;
  if (k === 'mq'){ ui.sheet.q = t.value; $('#mlist').innerHTML = exManList(); return; }
  if (k === 'sq'){ ui.sheet.q = t.value; $('#slist').innerHTML = exStatsList(); return; }
  if (k === 'pq'){ ui.sheet.q = t.value; $('#plist').innerHTML = pickerList(); return; }
  if (k === 'cname'){ ui.sheet.name = t.value; return; }
  const w = W(); if (!w) return;
  if (k === 'wname'){ w.name = t.value; save(); }
  else if (k === 'snote'){ w.items[+t.dataset.i].sets[+t.dataset.j].n = t.value; autosize(t); placeTB(); save(); const cp = $('#tbCopy'); if (cp) cp.hidden = !noteFaded(+t.dataset.i, +t.dataset.j); }
  else if (k === 'wnotes'){ w.notes = t.value; save(); }
  else if (k === 'exnote'){ w.items[+t.dataset.i].note = t.value; save(); }
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.k, w = W();
  if (!w || !t.value) return;
  if (k === 'start' || k === 'end'){ const ts = new Date(t.value).getTime(); if (!isNaN(ts)){ w[k] = ts; save(); render(); } }
});
document.addEventListener('focusin', e => {
  const t = e.target;
  if (!t.matches('input, textarea')) return;
  if (ui.kp){ ui.kp = null; refreshCells(); renderKP(); }
  if (t.dataset.k === 'snote'){ ui.nf = {i:+t.dataset.i, j:+t.dataset.j}; renderTB(); [300, 600].forEach(ms => setTimeout(placeTB, ms)); }

});
document.addEventListener('focusout', e => {
  if (['snote','wname'].includes(e.target.dataset?.k)){
    if (ui.nf) ui.lastNf = {f:ui.nf, at:Date.now()};
    setTimeout(() => { if (!document.activeElement?.matches?.('[data-k=snote], [data-k=wname]') && !ui.kp){ ui.nf = null; renderTB(); } }, 300);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input.name, [data-k=exnote]')){ e.target.blur(); return; }
  if (!ui.kp) return;
  if (ui.kp.c === 'n'){
    if (e.key.length === 1){ ui.buf += e.key; setV(ui.kp, ui.buf); save(); updateCell(); }
    else if (e.key === 'Backspace') tkey('del');
    else if (e.key === 'Enter') tkey('ret');
    else if (e.key === 'Tab') nav(e.shiftKey ? -1 : 1);
    else if (e.key === 'Escape') closeKP();
    else return;
    e.preventDefault(); return;
  }
  if (/^[0-9.]$/.test(e.key)) key(e.key);
  else if (e.key === 'Backspace') key('del');
  else if (e.key === 'Tab'){ nav(e.shiftKey ? -1 : 1); }
  else if (e.key === 'Enter'){ if (fieldFaded(ui.kp)) checkSet(); else nav(1); }
  else if (e.key === 'Escape') closeKP();
  else return;
  e.preventDefault();
});

if (S.active){ ui.screen = 'workout'; ui.wid = S.active; }
// offline support when installed as a home screen app
if ('serviceWorker' in navigator && !inFrame && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
}
